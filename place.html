<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madagascar - Travel Portal</title>
    <meta name="author" content="Diana C. Llerena">
    <meta name="description" content="This webpage explores the weather and data of Madagascar.">
    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/place-large.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&display=swap"
        rel="stylesheet">
    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/place.js" defer></script>
</head>

<body>
    <header class="center-items">
        <h1>Madagascar</h1>
    </header>
    <main>
        <picture>
            <source srcset="images/hero-large.webp" media="(min-width: 840px)">
            <source srcset="images/hero-medium.webp" media="(min-width: 550px)">
            <img src="images/hero-mobile.webp" alt= "Hero Image of the Avenue of Madagascar" loading="lazy">
        </picture>
        <section class="country-box">
            <h2>Data</h2>
            <div class="data-wrapper"></div>
        </section>
        <section class="weather-box">
            <h2>Weather</h2>
            <img src="images/weather.svg" alt="Weather Icon" width="100">
            <div class="weather-data"></div>
        </section>
    </main>
    <footer class="center-items">
        <p>©<span id="currentyear"></span> 🧝🏻‍♀️ Diana Llerena 🧝🏻‍♀️ Lima, Perú</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
